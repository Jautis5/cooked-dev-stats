name: Refresh public social stats
on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: What requested this collection
        type: choice
        options: [manual, continuous_clock, watchdog]
        default: manual
      clock_run_id:
        description: Verified clock run that requested collection
        type: string
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: public-stats-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'yt-dlp==2026.8.19'
      - name: Test collection and concurrent publishing
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check dashboard logic
        run: |
          node --check site/app.js
          node scripts/test_dashboard.cjs
          node scripts/test_chart.cjs
          node scripts/test_workspace.cjs
      - name: Collect registered channels without a browser
        id: collect
        continue-on-error: true
        env:
          COLLECTION_INITIATOR: ${{ inputs.reason || github.event_name }}
          COLLECTION_CLOCK_RUN_ID: ${{ inputs.clock_run_id }}
        run: python scripts/refresh_all.py
      - name: Validate and publish with conflict recovery
        run: python scripts/publish_refresh.py
      - name: Keep public observations for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-observations-${{ github.run_id }}
          path: |
            data/latest.json
            data/health.json
            data/*.csv
            data/indian-builds/latest.json
            data/indian-builds/*.csv
            data/dont-get-traced/latest.json
            data/dont-get-traced/*.csv
          retention-days: 1
      - name: Report cloud status
        if: always()
        run: python scripts/cloud_summary.py
      - name: Publish the latest dashboard fallback explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Surface collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
