name: Refresh public social stats
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-stats-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'yt-dlp>=2026.8.19'
      - name: Collect public metrics
        run: python scripts/collect.py
      - name: Validate and save snapshot
        run: |
          python scripts/test_collector.py
          python scripts/test_changes.py
          python scripts/test_data.py
          git config user.name 'Cooked Dev Stats'
          git config user.email 'stats@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public social metrics'
            git push
          fi
