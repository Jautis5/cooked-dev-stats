name: Refresh public social stats
on:
  schedule:
    - cron: '7-59/15 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: What requested this collection
        type: choice
        options: [manual, continuous_clock, watchdog, browser_probe]
        default: manual
      clock_run_id:
        description: Verified clock run that requested collection
        type: string
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: public-stats-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: inputs.reason != 'browser_probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'yt-dlp==2026.10.26'
      - name: Test collection and concurrent publishing
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check dashboard logic
        run: |
          node --check site/app.js
          node scripts/test_dashboard.cjs
          node scripts/test_chart.cjs
          node scripts/test_workspace.cjs
          node scripts/test_official_broker.cjs
      - name: Discover and import verified Facebook public grid views
        timeout-minutes: 6
        continue-on-error: true
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import datetime, json, pathlib, re, sys
          from urllib.parse import urlsplit, parse_qs
          import yt_dlp
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, 'scripts')
          from import_channel_capture import merge
          from collect_channels import record
          root = pathlib.Path.cwd()
          def stamp():
              return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def count(label):
              m = re.fullmatch(r'([0-9]+(?:[.,][0-9]+)?)\s*([KMB]?)', label.strip(), re.I)
              if not m:return None
              raw, unit = m.groups()
              if ',' in raw and not unit and len(raw.split(',')[-1]) == 3:raw = raw.replace(',', '')
              else:raw = raw.replace(',', '.')
              return dict(value=round(float(raw)*{'':1,'K':1000,'M':1000000,'B':1000000000}[unit.upper()]), approximate=bool(unit))
          assert count('67K') == {'value':67000,'approximate':True}
          assert count('446') == {'value':446,'approximate':False}
          assert count('Log in') is None
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--mute-audio'])
              for channel in json.loads((root/'data/channels.json').read_text())['channels']:
                  path = root/channel['dataPath']
                  data = json.loads(path.read_text())
                  account = next((a for a in data['accounts'] if a['id']=='facebook'), None)
                  if not account:continue
                  owner = account.get('expectedPageId') or parse_qs(urlsplit(account['url']).query).get('id',[''])[0]
                  if not owner:continue
                  url = account['url']
                  url += '&sk=reels_tab' if 'profile.php?' in url else ''
                  context = browser.new_context(locale='en-US', viewport={'width':1280,'height':900})
                  page = context.new_page()
                  page.route('**/*', lambda route: route.abort() if route.request.resource_type == 'media' else route.continue_())
                  found = {}
                  try:
                      page.goto(url, wait_until='domcontentloaded', timeout=25000)
                      page.wait_for_timeout(2500)
                      final = urlsplit(page.url)
                      if owner not in final.path.split('/') and parse_qs(final.query).get('id') != [owner]:
                          raise ValueError('Page owner redirect mismatch')
                      stable = 0
                      for attempt in range(20):
                          previous = len(found)
                          observed = stamp()
                          rows = page.locator('a[href]').evaluate_all("els => els.map(a => ({url:a.href,label:(a.innerText || a.getAttribute('aria-label') || '').trim()}))")
                          for row in rows:
                              match = re.fullmatch(r'https://www[.]facebook[.]com/reel/([0-9]+)/?(?:[?].*)?',row['url'])
                              metric = count(row['label'])
                              if match and metric is not None:
                                  found[match[1]] = dict(id=match[1],url='https://www.facebook.com/reel/'+match[1]+'/',metric=metric,at=observed)
                          stable = stable+1 if len(found)==previous else 0
                          if stable >= 3:break
                          page.mouse.wheel(0, 1400)
                          page.wait_for_timeout(1500)
                  except Exception as e:
                      print(json.dumps(dict(channelId=channel['id'],stage='grid',errorType=type(e).__name__)))
                  finally:
                      context.close()
                  imported = 0
                  before = len(data['videos'])
                  for item in found.values():
                      try:
                          with yt_dlp.YoutubeDL(dict(quiet=True,skip_download=True,cachedir=False,noplaylist=True,socket_timeout=10,retries=0,extractor_retries=0)) as y:
                              info = y.extract_info(item['url'],download=False)
                          if not info or str(info.get('id')) != item['id'] or str(info.get('uploader_id')) != str(owner):continue
                          if not info.get('formats') and not info.get('url'):continue
                          caption = info.get('description') or info.get('title')
                          if not caption:continue
                          post = dict(id=item['id'],url=item['url'],caption=caption,public=True,isVideo=True,ownerPageId=str(owner),metrics={'views':item['metric']})
                          capture = dict(channelId=channel['id'],platforms={'facebook':dict(accountUrl=account['url'],browserProfile='github-actions-anonymous',observedAt=item['at'],completeList=False,posts=[post])})
                          data = merge(data,capture)
                          imported += 1
                      except Exception as e:
                          print(json.dumps(dict(channelId=channel['id'],postId=item['id'],stage='verify',errorType=type(e).__name__)))
                  if imported:
                      record(data,path.parent)
                  print(json.dumps(dict(channelId=channel['id'],gridCandidates=len(found),verifiedGridViews=imported,newVideos=len(data['videos'])-before,inventoryComplete=False)),flush=True)
              browser.close()
          
          PY
      - name: Collect registered channels without a browser
        id: collect
        continue-on-error: true
        env:
          COLLECTION_INITIATOR: ${{ inputs.reason || github.event_name }}
          COLLECTION_CLOCK_RUN_ID: ${{ inputs.clock_run_id }}
          SOCIAL_STATS_BROKER_URL: ${{ secrets.SOCIAL_STATS_BROKER_URL }}
          SOCIAL_STATS_BROKER_KEY: ${{ secrets.SOCIAL_STATS_BROKER_KEY }}
        run: python scripts/refresh_all.py
      - name: Collect distinct Facebook public video counters
        timeout-minutes: 4
        continue-on-error: true
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, json, math, pathlib, sys
          from urllib.parse import urlsplit, parse_qs
          import yt_dlp
          sys.path.insert(0, 'scripts')
          from collect_channels import record
          root = pathlib.Path.cwd()
          def verified(info, post_id, owner):
              n = info.get('view_count')
              return str(info.get('id')) == str(post_id) and str(info.get('uploader_id')) == str(owner) and isinstance(n, (int, float)) and not isinstance(n, bool) and math.isfinite(n) and n >= 0
          assert verified({'id':'1','uploader_id':'2','view_count':0},'1','2')
          assert not verified({'id':'1','uploader_id':'3','view_count':10},'1','2')
          assert not verified({'id':'3','uploader_id':'2','view_count':10},'1','2')
          assert not verified({'id':'1','uploader_id':'2','view_count':None},'1','2')
          def read(job):
              post, owner = job
              try:
                  opts = dict(quiet=True, skip_download=True, socket_timeout=12, retries=0, extractor_retries=0, cachedir=False, noplaylist=True)
                  with yt_dlp.YoutubeDL(opts) as y:
                      info = y.extract_info(post['url'], download=False)
                  if not verified(info or {}, post['id'], owner):
                      return post, None
                  return post, dict(value=info['view_count'], at=datetime.datetime.now(datetime.timezone.utc).isoformat(), source=post['url'], method='yt_dlp_public_facebook', approximate=False, definition='Facebook public extractor view_count; not interchangeable with Reels grid or Content Library Views', extractorVersion='2026.10.26')
              except Exception:
                  return post, None
          for channel in json.loads((root/'data/channels.json').read_text())['channels']:
              path = root/channel['dataPath']
              data = json.loads(path.read_text())
              account = next((a for a in data['accounts'] if a['id']=='facebook'), None)
              if not account:
                  continue
              owner = account.get('expectedPageId') or parse_qs(urlsplit(account['url']).query).get('id', [''])[0]
              if not owner:
                  continue
              posts = [v['posts']['facebook'] for v in data['videos'] if 'facebook' in v.get('posts', {})]
              updated = 0
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  for post, metric in pool.map(read, [(p, owner) for p in posts]):
                      if metric is not None:
                          post.setdefault('metrics', {})['facebookPublicVideoViews'] = metric
                          updated += 1
              if updated:
                  record(data, path.parent)
              print(json.dumps(dict(channelId=channel['id'], knownPosts=len(posts), publicCountersUpdated=updated, inventoryComplete=False)))
          PY
      - name: Validate and publish with conflict recovery
        run: python scripts/publish_refresh.py
      - name: Keep public observations for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-observations-${{ github.run_id }}
          path: |
            data/channels.json
            data/health.json
            data/latest.json
            data/**/latest.json
            data/*.csv
            data/**/*.csv
          retention-days: 1
      - name: Report cloud status
        if: always()
        run: python scripts/cloud_summary.py
      - name: Publish the latest dashboard fallback explicitly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Surface collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1

  anonymous_browser_probe:
    if: github.event_name == 'workflow_dispatch' && inputs.reason == 'browser_probe'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public browser runtime
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test registered public profiles without login
        run: |
          python - <<'PY'
          import datetime, json, os, pathlib, re
          from playwright.sync_api import sync_playwright
          root = pathlib.Path.cwd()
          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--mute-audio'])
              for channel in json.loads((root/'data/channels.json').read_text())['channels']:
                  feed = json.loads((root/channel['dataPath']).read_text())
                  for account in feed['accounts']:
                      platform = account['id']
                      if platform not in ('instagram', 'facebook'):
                          continue
                      url = account['url']
                      if platform == 'instagram':
                          url = url.rstrip('/') + '/reels/'
                      elif 'profile.php?' in url:
                          url += '&sk=reels_tab'
                      context = browser.new_context(locale='en-US', viewport={'width':1280,'height':900})
                      page = context.new_page()
                      page.route('**/*', lambda route: route.abort() if route.request.resource_type == 'media' else route.continue_())
                      row = dict(channelId=channel['id'], platform=platform, source=url, complete=False, candidates=[])
                      try:
                          response = page.goto(url, wait_until='domcontentloaded', timeout=25000)
                          page.wait_for_timeout(2500)
                          links = {}
                          blocked = False
                          for attempt in range(4):
                              body = page.locator('body').inner_text(timeout=5000)
                              low = body.lower()
                              blocked = any(t in low for t in ('log in to continue', 'log into instagram', 'log into facebook', 'confirm you are human', 'security check', 'sorry, something went wrong', 'this content isn’t available'))
                              for item in page.locator('a[href]').evaluate_all("els => els.map(a => ({url:a.href, label:(a.innerText || a.getAttribute('aria-label') || '').slice(0,120)}))"):
                                  pattern = r'instagram[.]com/(?:[^/]+/)?(?:reel|p)/[A-Za-z0-9_-]+' if platform == 'instagram' else r'facebook[.]com/reel/[0-9]+'
                                  if re.search(pattern, item['url']):
                                      links[item['url'].split('?')[0]] = item['label']
                              if blocked:
                                  break
                              page.mouse.wheel(0, 1200)
                              page.wait_for_timeout(1500)
                          row.update(httpStatus=response.status if response else None, finalUrl=page.url.split('?')[0], access='login_or_challenge' if blocked else 'public_page' if links else 'no_video_links_exposed', candidates=[dict(url=k, label=v) for k,v in links.items()][:100], candidateCount=len(links))
                      except Exception as e:
                          row.update(access='navigation_failed', errorType=type(e).__name__)
                      row['observedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
                      results.append(row)
                      print(json.dumps(row), flush=True)
                      context.close()
              browser.close()
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              print('## Anonymous cloud browser experiment', file=f)
              print('No logins, imported cookies or feed changes. Candidate links are not verified publications; no inventory is marked complete.', file=f)
              print('', file=f)
              print('| Channel | Platform | Access | Candidate URLs |', file=f)
              print('|---|---|---|---|', file=f)
              for r in results:
                  print('| '+r['channelId']+' | '+r['platform']+' | '+r['access']+' | '+str(r.get('candidateCount',0))+' |', file=f)
              print('', file=f)
              print(json.dumps(results, indent=2), file=f)
          
          PY
