name: Refresh Kit subscriber count
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect_kit.py', '.github/workflows/kit.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: kit-subscriber-count
  cancel-in-progress: false
jobs:
  collect:
    if: github.repository == 'Jautis5/cooked-dev-stats' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify aggregate-only collection
        run: python -m unittest discover -s scripts -p test_kit.py
      - name: Read confirmed subscriber count
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
        run: python scripts/collect_kit.py
      - name: Publish count without overwriting concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- site/data/kit.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/kit.json
          git commit -m 'Refresh Kit confirmed subscriber count'
          published=false
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then published=true; break; fi
          done
          if [ "$published" != true ]; then exit 1; fi
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Surface API failure after preserving the last verified count
        run: |
          python - <<'PYTHON'
          import json, pathlib
          status = json.loads(pathlib.Path('site/data/kit.json').read_text())['status']
          if status != 'ok':
              raise SystemExit('Kit update failed; the last verified observation was preserved.')
          PYTHON
