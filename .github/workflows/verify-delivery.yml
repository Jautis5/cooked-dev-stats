name: Verify autonomous delivery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  verify:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Publish current snapshots using a temporary job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Check clock recovery using a temporary job token
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main
