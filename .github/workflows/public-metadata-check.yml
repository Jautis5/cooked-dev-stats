name: Verify public YouTube counters
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect.py', 'scripts/refresh_all.py', '.github/workflows/public-metadata-check.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Jautis5/cooked-dev-stats' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owned public metadata from a hosted runner
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          from refresh_all import prefetch_youtube
          root=pathlib.Path.cwd()
          registry=json.loads((root/'data/channels.json').read_text())['channels']
          observed=prefetch_youtube(root,registry)
          fresh=[{'channel':c,'postId':p,'metrics':m} for (c,p),m in observed.items() if m]
          if not fresh:raise ValueError('Public YouTube metadata unavailable')
          for row in fresh:print(json.dumps(row),flush=True)
          PY
