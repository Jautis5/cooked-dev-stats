name: Update official read broker source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-read-broker-source-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'Jautis5/cooked-dev-stats' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard, test and publish only the reviewed public source
        run: |
          python - <<'PY'
          import base64,hashlib,subprocess,zlib
          original=subprocess.check_output(['git','show','22429f55fec854007d54a273760730f2ba616ae7:integrations/apps-script/Code.gs'])
          assert hashlib.sha256(original).hexdigest()=='b2ff89d0ac0f53800fe9e7e44c38694557d552ffeaf23d85b51f4083235ede84'
          decoder=zlib.decompressobj(zdict=original[-32768:])
          source=decoder.decompress(base64.b64decode('',validate=True),200000)+decoder.flush()
          assert len(source)<200000 and hashlib.sha256(source).hexdigest()=='5b544095d5b7a4987e0dc26ac4d8e24fd42f42cc6d969eef3257cdc09e68017f'
          exec(compile(source,'reviewed-public-source-update','exec'))
          PY
      - name: Keep public source verification
        uses: actions/upload-artifact@v4
        with:
          name: official-source-verification-${{ github.run_id }}
          path: official-source-update-verification.json
          retention-days: 7
