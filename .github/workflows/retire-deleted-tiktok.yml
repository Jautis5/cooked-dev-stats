name: Retire owner-deleted TikTok accounts
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: retire-owner-deleted-tiktok
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Jautis5/cooked-dev-stats' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source patch and preserve actual metrics
        run: |
          python - <<'PY'
          import base64, copy, gzip, hashlib, json, pathlib, subprocess, sys, tempfile
          patch = json.loads(gzip.decompress(base64.b64decode('')))
          root = pathlib.Path.cwd()
          def git(folder,*args,check=True):
              return subprocess.run(['git','-C',str(folder),*args],check=check,text=True,capture_output=True)
          for attempt in range(4):
              git(root,'fetch','--no-tags','origin','main')
              head=git(root,'rev-parse','FETCH_HEAD').stdout.strip()
              with tempfile.TemporaryDirectory(prefix='retire-owned-accounts-') as tmp:
                  work=pathlib.Path(tmp)/'publisher'
                  git(root,'worktree','add','--detach',str(work),head)
                  try:
                      for name,change in patch.items():
                          assert name in patch and not name.startswith(('.git/','.github/'))
                          target=work/name
                          original=target.read_bytes() if target.exists() else None
                          digest=hashlib.sha256(original).hexdigest() if original is not None else None
                          if digest==change['afterSha256']:continue
                          assert digest==change['beforeSha256'], 'Source changed: '+name
                          if original is None:text=change['text']
                          else:
                              lines=original.decode().splitlines(keepends=True)
                              for first,last,replacement in reversed(change['edits']):lines[first:last]=replacement
                              text=''.join(lines)
                          blob=text.encode()
                          assert hashlib.sha256(blob).hexdigest()==change['afterSha256']
                          target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(blob)
                      subprocess.run([sys.executable,'-m','unittest','discover','-s','scripts','-p','test_*.py'],cwd=work,check=True)
                      subprocess.run(['node','--check','site/app.js'],cwd=work,check=True)
                      for suite in ['test_dashboard.cjs','test_chart.cjs','test_workspace.cjs','test_official_broker.cjs','test_retired_accounts.cjs']:
                          subprocess.run(['node','scripts/'+suite],cwd=work,check=True)
                      sys.path.insert(0,str(work/'scripts'))
                      import collect as base
                      for config in json.loads((work/'data/channels.json').read_text())['channels']:
                          if config['id'] not in ['click-theory','dumb-luck']:continue
                          path=work/config['dataPath'];data=json.loads(path.read_text())
                          original=copy.deepcopy(data)
                          base.apply_account_policy(data,config)
                          assert data['videos']==original['videos']
                          for account,prior in zip(data['accounts'],original['accounts']):
                              assert account.get('metrics')==prior.get('metrics')
                              assert account['url']==prior['url']
                              if account['id']!='tiktok':assert account==prior
                          assert data.get('history')==original.get('history')
                          assert data.get('assetLibrary')==original.get('assetLibrary')
                          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
                          base.exports(data,path.parent)
                      allowed=list(patch)+[name for channel in ['click-theory','dumb-luck'] for name in ['data/'+channel+'/'+file for file in ['latest.json','posts.csv','platforms.csv','metrics.csv']]]
                      git(work,'add','--',*allowed)
                      if git(work,'diff','--cached','--quiet',check=False).returncode==0:
                          print(json.dumps({'alreadyApplied':True,'commit':head}));break
                      git(work,'-c','user.name=Social Stats Cloud','-c','user.email=stats@users.noreply.github.com','commit','-m','Stop collection for owner-deleted TikTok accounts and retain history')
                      pushed=git(work,'push','origin','HEAD:refs/heads/main',check=False)
                      if pushed.returncode==0:
                          print(json.dumps({'publishedCommit':git(work,'rev-parse','HEAD').stdout.strip(),'sourceFiles':len(patch),'retiredIdentities':2,'historicalMetricDatesPreserved':True}));break
                      if attempt==3:raise RuntimeError('Concurrent updates prevented bounded publication')
                  finally:
                      git(root,'worktree','remove','--force',str(work),check=False)
          PY
      - name: Publish canonical dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
